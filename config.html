<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Config Editor</title>

    <link rel="stylesheet" href="config.css">
</head>

<body>

    <main class="config-container">

        <!-- HEADER -->
        <header class="config-header">

            <h1>Game Config Editor</h1>

            <a href="index.html">
                ← Back to Game
            </a>

        </header>


        <!-- PLAYER SETTINGS -->
        <section class="config-section">

            <h2>Player</h2>

            <div class="config-row">

                <label for="cfg_PLAYER_SPEED">
                    Player Speed (blocks/sec)
                </label>

                <input
                    type="number"
                    id="cfg_PLAYER_SPEED"
                    step="0.01"
                >

            </div>


            <div class="config-row">

                <label for="cfg_PLAYER_BULLET_SPEED">
                    Bullet Speed (blocks/sec)
                </label>

                <input
                    type="number"
                    id="cfg_PLAYER_BULLET_SPEED"
                    step="0.01"
                >

            </div>


            <div class="config-row">

                <label for="cfg_PLAYER_SHOOT_COOLDOWN">
                    Shoot Cooldown (ms)
                </label>

                <input
                    type="number"
                    id="cfg_PLAYER_SHOOT_COOLDOWN"
                    step="10"
                >

            </div>

        </section>


        <!-- WORLD SETTINGS -->
        <section class="config-section">

            <h2>World</h2>

            <div class="config-row">

                <label for="cfg_STRUCTURE_DENSITY_BLOCKS">
                    Structure Density
                </label>

                <input
                    type="number"
                    id="cfg_STRUCTURE_DENSITY_BLOCKS"
                    step="1"
                >

            </div>

        </section>


        <!-- ADVANCED SETTINGS -->
        <section class="config-section">

            <h2>Advanced Configuration</h2>

            <p class="config-help">
                Structure grid flags: <strong>0</strong> = empty,
                <strong>1</strong> = wall, <strong>2</strong> = random enemy,
                <strong>3</strong> = g-bot, <strong>4</strong> = j-bot,
                <strong>5</strong> = h-bot.
            </p>

            <textarea
                id="cfg_ADVANCED"
                rows="20"
                spellcheck="false"
                placeholder='{"ENEMY_TYPES": {...}}'
            ></textarea>

        </section>


        <!-- ACTIONS -->
        <section class="config-actions">

            <button
                id="applyConfigBtn"
                class="apply-btn"
            >
                Save Locally
            </button>

            <button
                id="exportConfigBtn"
                class="export-btn"
            >
                Export config.json
            </button>

            <button
                id="resetConfigBtn"
                class="reset-btn"
            >
                Reset to config.json
            </button>

        </section>


        <!-- STATUS -->
        <div id="statusMessage"></div>

    </main>


    <script type="module" src="config.js"></script>

</body>
</html>
