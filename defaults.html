<!doctype html>
<html lang="en">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>The Game — Combat defaults</title><link rel="stylesheet" href="css/config.css">
</head>
<body>
 <main class="config-container">
  <header class="page-header"><a href="menu.html">← Menu</a><h1>Combat defaults</h1></header>
  <p class="muted">Sandbox only</p>
  <div class="menu-actions">
   <button id="saveDefaultsBtn" class="apply-btn" type="button">Save</button>
   <button id="importDefaultsBtn" type="button">Import</button>
   <button id="exportDefaultsBtn" type="button">Export</button>
   <button id="resetDefaultsBtn" type="button">Reset</button>
  </div>
  <input id="importDefaultsFileInput" type="file" accept=".json,application/json" hidden>
  <div id="defaultsStatus" class="menu-status" role="status"></div>
  <label for="defaultsData" class="visually-hidden">Combat defaults JSON</label>
  <textarea id="defaultsData" rows="24" spellcheck="false"></textarea>
 </main>
 <script type="module" src="js/defaults-editor.js"></script>
</body></html>
