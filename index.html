<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>The Game</title>

		<link rel="stylesheet" href="css/style.css" />
	</head>

	<body>
		<canvas id="gameCanvas" width="1920" height="1080"></canvas>
		<button id="respawnBtn" type="button" hidden>Respawn</button>

		<!-- DEBUG UI -->
		<div id="debugUI" class="debug-ui" hidden>
			<details class="runtime-details"><summary>Performance</summary>
			<div id="performanceStats" class="performance-stats">
				<span id="performanceFps">FPS: --</span>
				<span id="performanceTargetFps">Target FPS: 60</span>
				<span id="performanceMsPerTick">ms/tick: --</span>
				<span id="performanceEntityCount">Entities: --</span>
				<span id="performanceEnemyCount">Enemies: --</span>
				<span id="performanceBulletCount">Bullets: -- (Player: -- / Enemy: --)</span>
			</div>

			</details>
			<div class="debug-runtime-controls">
				<strong>Replay</strong>
				<div class="debug-button-row">
					<button id="replayRecordBtn" type="button">Record</button>
					<button id="replayStopRecordingBtn" type="button" disabled>Stop</button>
				</div>
				<div id="replayStatus">Replay recording idle.</div>
				<a class="debug-menu-link" href="menu.html#replays">Replay Setup</a>
				<a class="debug-menu-link" href="menu.html">Main Menu</a>
			</div>
		</div>

		<script type="module" src="js/main.js"></script>
	</body>
</html>
