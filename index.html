<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Demo</title>

		<link rel="stylesheet" href="css/style.css" />
	</head>

	<body>
		<canvas id="gameCanvas" width="1280" height="720"></canvas>

		<!-- GAME DEBUG / LEVEL EDITOR -->
		<div id="editorUI" class="ui-panel">
			<h3>Level Editor & Debug</h3>

			<label>
				<input type="checkbox" id="godModeToggle" />
				Toggle Invincibility (God Mode)
			</label>

			<br /><br />

			<textarea id="levelData" rows="10" cols="35">
{
    "seed": 12345,
    "playerSpawn": { "x": 1, "y": 1 },
    "enemySpawns": [],
    "enemySpawnRate": 0.5,
    "walls": []
}
        </textarea
			>

			<br />

			<button id="loadLevelBtn">Load Level / Apply</button>

			<button id="hideUIBtn" style="margin-left: 5px">
				Toggle UI (H)
			</button>

			<br />

			<a href="config.html" class="config-link"> Open Config Editor </a>
		</div>

		<script type="module" src="js/main.js"></script>
	</body>
</html>
