<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Small styling tweaks to keep the UI clean */
        .ui-panel {
            position: absolute; 
            top: 10px; 
            background: rgba(0,0,0,0.85); 
            color: white; 
            padding: 15px; 
            z-index: 10;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
        }
        .ui-panel h3 { margin-top: 0; color: cyan; }
        .ui-panel input[type="number"], .ui-panel textarea {
            width: 100%;
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 5px;
            margin-top: 5px;
            box-sizing: border-box;
        }
        .ui-panel button {
            background: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 10px;
        }
        .ui-panel button:hover { background: #666; }
        .config-row { margin-bottom: 12px; }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <div id="editorUI" class="ui-panel" style="left: 10px;">
        <h3>Level Editor & Debug</h3>
        <label>
            <input type="checkbox" id="godModeToggle"> Toggle Invincibility (God Mode)
        </label>
        <br><br>
        <textarea id="levelData" rows="10" cols="35">
{
    "seed": 12345,
    "playerSpawn": { "x": 3, "y": 5 },
    "enemySpawns": [],
    "enemySpawnRate": 0.5, 
    "walls": []
}
        </textarea>
        <br>
        <button id="loadLevelBtn">Load Level / Apply</button>
        <button id="hideUIBtn" style="margin-left: 5px;">Toggle UI (H)</button>
    </div>

    <div id="configUI" class="ui-panel" style="right: 10px; width: 280px; max-height: 90vh; overflow-y: auto;">
        <h3>Config Editor</h3>
        
        <div class="config-row">
            <label>Player Speed: </label>
            <input type="number" id="cfg_PLAYER_SPEED" step="0.01">
        </div>
        
        <div class="config-row">
            <label>Bullet Speed: </label>
            <input type="number" id="cfg_PLAYER_BULLET_SPEED" step="0.01">
        </div>
        
        <div class="config-row">
            <label>Shoot Cooldown (ms): </label>
            <input type="number" id="cfg_PLAYER_SHOOT_COOLDOWN" step="10">
        </div>
        
        <div class="config-row">
            <label>Structure Density: </label>
            <input type="number" id="cfg_STRUCTURE_DENSITY_BLOCKS" step="1">
        </div>

        <div class="config-row">
            <label>Advanced Config (JSON):</label>
            <textarea id="cfg_ADVANCED" rows="6" placeholder='{"ENEMY_TYPES": {...}}'></textarea>
        </div>
        
        <button id="applyConfigBtn" style="background: royalblue;">Apply Config</button>
        <button id="exportConfigBtn" style="background: darkgreen;">Export config.json</button>
    </div>

    <script type="module" src="game.js"></script>

    <script>
        // Note: In your game.js, make sure the 'Config' object is attached to the window 
        // (e.g., window.Config = Config;) so this script can interact with it, 
        // OR move this logic directly into game.js.

        document.addEventListener("DOMContentLoaded", () => {
            // Function to populate the UI with current Config values
            window.syncConfigToUI = function() {
                if (!window.Config) return;
                document.getElementById("cfg_PLAYER_SPEED").value = window.Config.PLAYER_SPEED;
                document.getElementById("cfg_PLAYER_BULLET_SPEED").value = window.Config.PLAYER_BULLET_SPEED;
                document.getElementById("cfg_PLAYER_SHOOT_COOLDOWN").value = window.Config.PLAYER_SHOOT_COOLDOWN;
                document.getElementById("cfg_STRUCTURE_DENSITY_BLOCKS").value = window.Config.STRUCTURE_DENSITY_BLOCKS;
                
                // Pack complex objects into the advanced text area
                const advancedData = {
                    ENEMY_TYPES: window.Config.ENEMY_TYPES,
                    STRUCTURE_LIBRARY: window.Config.STRUCTURE_LIBRARY
                };
                document.getElementById("cfg_ADVANCED").value = JSON.stringify(advancedData, null, 2);
            };

            // Apply UI values back to the Config object
            document.getElementById("applyConfigBtn").addEventListener("click", () => {
                if (!window.Config) return alert("Config object not found!");
                
                window.Config.PLAYER_SPEED = parseFloat(document.getElementById("cfg_PLAYER_SPEED").value);
                window.Config.PLAYER_BULLET_SPEED = parseFloat(document.getElementById("cfg_PLAYER_BULLET_SPEED").value);
                window.Config.PLAYER_SHOOT_COOLDOWN = parseInt(document.getElementById("cfg_PLAYER_SHOOT_COOLDOWN").value, 10);
                window.Config.STRUCTURE_DENSITY_BLOCKS = parseFloat(document.getElementById("cfg_STRUCTURE_DENSITY_BLOCKS").value);
                
                try {
                    const advancedData = JSON.parse(document.getElementById("cfg_ADVANCED").value);
                    if (advancedData.ENEMY_TYPES) window.Config.ENEMY_TYPES = advancedData.ENEMY_TYPES;
                    if (advancedData.STRUCTURE_LIBRARY) window.Config.STRUCTURE_LIBRARY = advancedData.STRUCTURE_LIBRARY;
                    
                    // Update live player stats
                    if (window.player) {
                        window.player.speed = window.Config.PLAYER_SPEED;
                    }
                    
                    alert("Configuration Applied Successfully!");
                } catch (e) {
                    alert("Invalid JSON in Advanced Config: " + e.message);
                }
            });

            // Export to JSON file
            document.getElementById("exportConfigBtn").addEventListener("click", () => {
                if (!window.Config) return;
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.Config, null, 4));
                const a = document.createElement('a');
                a.href = dataStr;
                a.download = "config.json";
                document.body.appendChild(a);
                a.click();
                a.remove();
            });
            
            // Link UI toggle (H key) to hide both panels
            document.getElementById("hideUIBtn").addEventListener("click", () => {
                const configUI = document.getElementById("configUI");
                configUI.style.display = configUI.style.display === "none" ? "block" : "none";
            });
        });
    </script>
</body>
</html>
